    <div id="root">
      <!-- Заставка: показывается до монтирования React и исчезает автоматически -->
      <div id="boot" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#171110;color:#fff;font-family:Inter,system-ui,sans-serif">

      </div>
      <style>
        @keyframes bootrun { 0%{transform:translateX(-100%)} 100%{transform:translateX(300%)} }
      </style>
    </div>

    <!--
      Страховка от белого экрана.
      Этот файл — ШАБЛОН ДЛЯ СБОРКИ: он подключает /src/main.tsx (TypeScript+JSX),
      который браузер выполнить не может. Работает только собранный dist/index.html.
      Если открыт именно шаблон, скрипт ниже:
        1) ищет рядом собранную версию и незаметно переходит на неё;
        2) если её нет — показывает понятную подсказку вместо пустой страницы.
    -->
    <script>
      window.__ntBeautyBooted = false;

      (function () {
        var handled = false;

        function showHint() {
          var b = document.getElementById("boot");
          if (!b) return;
          b.innerHTML =
          '<div style="max-width:520px;padding:28px;text-align:center">' +
          '<div style="font-family:\'Playfair Display\',Georgia,serif;font-size:2rem">NT Beauty</div>' +
          '<p style="margin:14px 0;line-height:1.6;color:rgba(255,255,255,.62);font-size:.95rem">' +
          'Страница не загрузилась. Скорее всего, опубликован <b>исходный</b> index.html, а не собранный файл из папки <b>dist/</b>. ' +
          'Браузер не умеет выполнять <code style="color:#f58cb6">/src/main.tsx</code> — сайт нужно собрать (<code style="color:#f58cb6">npm run build</code>) и опубликовать содержимое <code style="color:#f58cb6">dist/</code>.' +
          '</p>' +
          '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">' +
          '<a href="https://yandex.ru/maps/org/nt_byuti/38042135240/?booking%5Bpage%5D=menu&booking%5Bpermalink%5D=38042135240&ll=37.923781%2C55.701719&source=serp_navig&z=16.74" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;background:linear-gradient(90deg,#c09b6c,#a8825a);color:#fff;text-decoration:none;font-weight:500">Записаться онлайн</a>' +
          '<a href="tel:+79998146444" style="display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;color:#fff;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)">+7 (999) 814-64-44</a>' +
          '</div></div>';
        }

        // Если рядом лежит собранная версия — незаметно уходим на неё
        function tryDist() {
          if (handled) return;
          try {
            if (sessionStorage.getItem("nt_tried_dist")) return showHint();
            sessionStorage.setItem("nt_tried_dist", "1");
          } catch (e) { /* приватный режим — продолжаем без флага */ }
          fetch("dist/index.html")
            .then(function (r) {
              if (r.ok) { handled = true; window.location.replace("dist/index.html"); }
              else showHint();
            })
            .catch(showHint);
        }

        function bailSoon() {
          if (window.__ntBeautyBooted || handled) return;
          setTimeout(function () {
            if (!window.__ntBeautyBooted && !handled) showHint();
          }, 1500);
        }

        // Ошибка загрузки или выполнения модуля = открыт шаблон, а не сборка
        window.addEventListener("error", function (e) {
          if (window.__ntBeautyBooted) return;
          if (e && e.target && e.target.tagName === "SCRIPT") return tryDist();
          bailSoon();
        }, true);

        window.addEventListener("unhandledrejection", bailSoon);

        // Крайний срок: приложение так и не смонтировалось
        setTimeout(function () {
          if (!window.__ntBeautyBooted && !handled) tryDist();
        }, 9000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
