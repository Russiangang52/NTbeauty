ашивание корней"],initials:"В",tint:"from-[#f1e2d4] to-[#e0c8b0]"},{name:"Ксения",role:"Мастер по наращиванию ресниц",bio:"Делает ресницы строго по запросу и очень аккуратно — даже если глаза обычно «обжигает» после процедур.",skills:["Наращивание ресниц","Ламинирование"],initials:"К",tint:"from-[#e5e0ee] to-[#cfc7dd]"},{name:"Диана",role:"Мастер маникюра",bio:"Лёгкая рука, быстрая и аккуратная работа. Гости отмечают бережное снятие покрытия и красивый результат с первого визита.",skills:["Маникюр","Снятие покрытия"],initials:"Д",tint:"from-[#f6dcd3] to-[#e6bfb1]"}],Gm=[{author:"Алина Ш.",level:"Знаток города 6 уровня",date:"август 2026",rating:5,photo:Ee("16413163/2a000001a03e9f0a716bb8ecc9a82d6389dd","XL"),text:"Ходим в этот салон уже не первый раз. Сегодня были на ламинировании ресниц и архитектуре бровей у мастера Татьяны. Всё сделала быстро и качественно, результатом как всегда довольны. В салоне чисто и убрано, интерьер на уровне. Угостили кофе и конфетами. Рекомендуем!"},{author:"Лизавета",level:"Знаток города 5 уровня",date:"июнь 2026",rating:5,photo:Ee("18777611/2a0000019ecc43e1aff83df98fb65e677e48","XL"),text:"Сегодня посетила салон красоты, была у мастера Анастасия. Очень понравилось. Мастер очень внимательная, приятная в общении, прислушивается к просьбам клиентов. Впервые получила именно те брови, которые хотела! Попали именно в тот цвет, который я хотела, форма получилась просто прекрасная! Теперь буду ходить только к этому мастеру и именно в этот салон красоты!"},{author:"Ксения Бронникова",level:"Знаток города 3 уровня",date:"февраль 2026",rating:5,photo:Ee("16415892/2a0000019c6abba2a11e4e36df82e17ea05b","XL"),text:"Была в салоне в декабре 2025 перед корпоративом: записалась на маникюр, педикюр, макияж и прическу. Меня обслуживали прекрасные мастера, мастер по макияжу и причёске была очень аккуратна, учла все пожелания, и я весь вечер получала комплименты. Мастер маникюра и педикюра Гуля сделала лучший маникюр в моей жизни! Хозяйка салона очень клиентоориентированная, приятная и душевная девушка — договорилась с мастерами, чтобы приняли меня пораньше утром."},{author:"Elena Demakova",level:"Знаток города 4 уровня",date:"декабрь 2025",rating:5,text:"Пришла на сложное окрашивание, к своему мастеру уже не смогла попасть, нужно было срочно обновить блонд и отросшие корни. Мастер Валерия великолепная! Сразу поняла, что мне надо. Очень профессионально владеет техниками, всё качественно и аккуратно сделала, объясняла каждый шаг. У меня за 11 лет сложного окрашивания такой красоты не было."},{author:"Anna Solovyeva",level:"Знаток города 7 уровня",date:"декабрь 2024",rating:5,photo:Ee("13940652/2a00000193b61b0f65b3abe49f78e4984c84","XL"),text:"Мой бывший мастер резко ушла из профессии, пришлось экстренно искать нового. Нашла эту студию на Яндекс Картах — и осталась в полнейшем восторге! Была у Анастасии уже 2 раза — делала и маникюр, и педикюр. Быстро, максимально качественно, цена приемлемая, салон восхитительный, очень чисто и красиво. Теперь я постоянный клиент."},{author:"Алина Разина",level:"Знаток города 6 уровня",date:"декабрь 2025",rating:5,text:"Постоянно хожу к Анастасии — прекрасный мастер и владелица студии, очень чуткая и внимательная. Также обожаю мастера по бровям Татьяну и мастера по окрашиванию Маргариту — девочки делают свою работу очень качественно и красиво. Рада, что рядом с домом есть такие профессионалы."},{author:"Виктория Ганина",level:"Знаток города 5 уровня",date:"ноябрь 2025",rating:5,text:"Была в этом салоне не первый раз. Если хотите классный образ на мероприятие — вам точно сюда к визажистам. С дочкой были два раза, и оба раза образ просто ВАУ. Если хотите красивый цвет волос, классную стрижку, здоровые волосы — то вам тоже сюда, к Маргарите."},{author:"Климова И.",level:"Знаток города 3 уровня",date:"июль 2025",rating:5,photo:Ee("15544497/2a00000197fa390a8e427018f5b2726ef9c2","XL"),text:"Можно было бы поставить 10 — поставила бы. Делала педикюр у Анастасии и брови, осталась под большим впечатлением. Настолько быстро и качественно никто и никогда за 20 лет мне не делал педикюр. Было так комфортно и уютно в кресле, как на облачке, и приятная беседа. И по бровям меня услышали, и цвет впервые тот, что нужно."},{author:"Яна Тищенко",level:"Знаток города 4 уровня",date:"апрель 2025",rating:5,photo:Ee("15278128/2a000001963fb7b2aa80f575d1eceb4bbf3d","XL"),text:"Не первый раз посещаю студию и каждый раз остаюсь в восторге. Записалась на AirTouch, и итог второго раза покорил моё сердечко: волосы стали настолько светлыми и красивыми, что я до сих пор не могу налюбоваться в зеркало. Спасибо большое Маргарите за прекрасную работу!"}],km=[{icon:"✶",title:"Онлайн-запись",note:"в карточке Яндекс Карт"},{icon:"◈",title:"Wi-Fi",note:"для гостей салона"},{icon:"◐",title:"Велопарковка",note:"рядом с салоном"},{icon:"❖",title:"Подарочные сертификаты",note:"на любую услугу"},{icon:"✿",title:"Beauty-бар",note:"чай, кофе и сладости"},{icon:"◇",title:"Предварительная запись",note:"удобное время без очереди"},{icon:"✽",title:"Туалет",note:"для гостей"},{icon:"➤",title:"Выезд на дом",note:"по договорённости"}],Is=["Наличными","Банковской картой","Кредитной картой","СБП","QR-код","Безналичный расчёт","Банковским переводом"],Ps=["Доступность входа на инвалидной коляске — полностью доступно","Парковка для людей с инвалидностью","Пандус"],vg=["Акции","Скидки","Спецпредложения","Подарки","Бонусы"],Js=[{path:"/",label:"Главная"},{path:"/services",label:"Услуги и цены"},{path:"/masters",label:"Мастера"},{path:"/gallery",label:"Галерея"},{path:"/reviews",label:"Отзывы"},{path:"/about",label:"О салоне"},{path:"/contacts",label:"Контакты"}],Ws=()=>{const s=window.location.hash.replace(/^#/,"").split("?")[0];return s.startsWith("/")?s:"/"};function Xm(){const[s,d]=Re.useState(Ws);return Re.useEffect(()=>{const x=()=>{d(Ws()),window.scrollTo({top:0,behavior:"instant"})};return window.addEventListener("hashchange",x),()=>window.removeEventListener("hashchange",x)},[]),s}function Qm(s){if(       который браузер выполнить не может. Работает только собранный dist/index.html.
      Если открыт именно шаблон, скрипт ниже:
        1) ищет рядом собранную версию и незаметно переходит на неё;
        2) если её нет — показывает понятную подсказку вместо пустой страницы.
    -->
    <script>
      window.__ntBeautyBooted = false;

      (function () {
        var handled = false;

        function showHint() {
          var b = document.getElementById("boot");
          if (!b) return;
          b.innerHTML =
          '<div style="max-width:520px;padding:28px;text-align:center">' +
          '<div style="font-family:\'Playfair Display\',Georgia,serif;font-size:2rem">NT Beauty</div>' +
          '<p style="margin:14px 0;line-height:1.6;color:rgba(255,255,255,.62);font-size:.95rem">' +
          'Страница не загрузилась. Скорее всего, опубликован <b>исходный</b> index.html, а не собранный файл из папки <b>dist/</b>. ' +
          'Браузер не умеет выполнять <code style="color:#f58cb6">/src/main.tsx</code> — сайт нужно собрать (<code style="color:#f58cb6">npm run build</code>) и опубликовать содержимое <code style="color:#f58cb6">dist/</code>.' +
          '</p>' +
          '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">' +
          '<a href="https://yandex.ru/maps/org/nt_byuti/38042135240/?booking%5Bpage%5D=menu&booking%5Bpermalink%5D=38042135240&ll=37.923781%2C55.701719&source=serp_navig&z=16.74" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;background:linear-gradient(90deg,#c09b6c,#a8825a);color:#fff;text-decoration:none;font-weight:500">Записаться онлайн</a>' +
          '<a href="tel:+79998146444" style="display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;color:#fff;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)">+7 (999) 814-64-44</a>' +
          '</div></div>';
        }

        // Если рядом лежит собранная версия — незаметно уходим на неё
        function tryDist() {
          if (handled) return;
          try {
            if (sessionStorage.getItem("nt_tried_dist")) return showHint();
            sessionStorage.setItem("nt_tried_dist", "1");
          } catch (e) { /* приватный режим — продолжаем без флага */ }
          fetch("dist/index.html")
            .then(function (r) {
              if (r.ok) { handled = true; window.location.replace("dist/index.html"); }
              else showHint();
            })
            .catch(showHint);
        }

        function bailSoon() {
          if (window.__ntBeautyBooted || handled) return;
          setTimeout(function () {
            if (!window.__ntBeautyBooted && !handled) showHint();
          }, 1500);
        }

        // Ошибка загрузки или выполнения модуля = открыт шаблон, а не сборка
        window.addEventListener("error", function (e) {
          if (window.__ntBeautyBooted) return;
          if (e && e.target && e.target.tagName === "SCRIPT") return tryDist();
          bailSoon();
        }, true);

        window.addEventListener("unhandledrejection", bailSoon);

        // Крайний срок: приложение так и не смонтировалось
        setTimeout(function () {
          if (!window.__ntBeautyBooted && !handled) tryDist();
        }, 9000);
      })();
    </script>
